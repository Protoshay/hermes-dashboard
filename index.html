<script>
(function() {
    const DATA = window.__HERMES_DATA__;
    if (!DATA) {
        document.getElementById('dashboard-content').innerHTML = '<p class="text-red-400 text-center py-20">No data available. Generate with: python generate_dashboard.py --demo</p>';
        return;
    }

    // ── Helpers ──
    function fmt(kpi) {
        const v = kpi.value;
        if (v === null || v === undefined) return '\u2014';
        switch (kpi.format) {
            case 'currency': return v >= 10000 ? '$' + (v/1000).toFixed(1) + 'k' : '$' + Number(v).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
            case 'currency_gbp': return v >= 10000 ? '\u00A3' + (v/1000).toFixed(1) + 'k' : '\u00A3' + Number(v).toLocaleString('en-GB', {minimumFractionDigits:2, maximumFractionDigits:2});
            case 'multiplier': return Number(v).toFixed(2) + 'x';
            case 'percent': return Number(v).toFixed(1) + '%';
            case 'number': return Number(v).toLocaleString();
            default: return String(v);
        }
    }

    function kpiColor(kpi) {
        const v = kpi.value;
        if (v === null || v === undefined) return 'text-slate-400';
        if (kpi.key === 'meta_roas') return v >= 2 ? 'text-emerald-400' : v > 0 ? 'text-amber-400' : 'text-slate-400';
        if (kpi.key === 'meta_cpa' || kpi.key === 'cac') return v > 30 ? 'text-red-400' : v > 20 ? 'text-amber-400' : 'text-emerald-400';
        if (kpi.key === 'gross_margin') return v >= 50 ? 'text-emerald-400' : v >= 40 ? 'text-slate-200' : 'text-red-400';
        if (kpi.key === 'inventory_alerts') return v > 0 ? 'text-red-400' : 'text-emerald-400';
        if (kpi.key === 'returning_pct') return v >= 25 ? 'text-emerald-400' : v >= 15 ? 'text-amber-400' : 'text-red-400';
        return 'text-white';
    }

    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    // ── KPI Row Builder ──
    function buildKpiRow(label, icon, color, group) {
        const kpis = DATA.kpis.filter(k => k.group === group);
        let cards = kpis.map(kpi => {
            const isHighlight = kpi.key === 'net_revenue' ? ' highlight' : '';
            const detail = kpi.detail ? `<p class="text-[10px] text-slate-600 mt-1">${esc(kpi.detail)}</p>` : '';
            return `<div class="kpi-card${isHighlight}">
                <p class="text-[11px] text-slate-500 mb-1.5 font-medium">${esc(kpi.label)}</p>
                <p class="text-2xl font-semibold font-mono tracking-tight ${kpiColor(kpi)}">${fmt(kpi)}</p>
                ${detail}
            </div>`;
        }).join('');

        return `<div>
            <div class="flex items-center gap-2 mb-2.5">
                <svg class="w-3.5 h-3.5 ${color}" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="${icon}"/></svg>
                <p class="text-[11px] font-mono text-slate-500 tracking-[0.15em] uppercase">${label}</p>
            </div>
            <div class="grid grid-cols-5 gap-3 kpi-grid">${cards}</div>
        </div>`;
    }

    // ── Products Table ──
    function buildProductsTable() {
        const shopify = (DATA.top_products_shopify || []).map(p => ({...p, channel: 'Shopify'}));
        const amazonUs = (DATA.top_products_amazon_us || []).map(p => ({...p, channel: 'Amazon US'}));
        const amazonUk = (DATA.top_products_amazon_uk || []).map(p => ({...p, channel: 'Amazon UK'}));
        let all = [...shopify, ...amazonUs, ...amazonUk].sort((a,b) => Number(b.revenue) - Number(a.revenue)).slice(0,10);
        if (all.length === 0) all = shopify.slice(0,10);

        const channelBadge = ch => {
            const cls = ch === 'Shopify' ? 'bg-purple-500/10 text-purple-400' : ch === 'Amazon US' ? 'bg-cyan-500/10 text-cyan-400' : 'bg-pink-500/10 text-pink-400';
            return `<span class="text-[10px] font-mono px-1.5 py-0.5 rounded ${cls}">${ch}</span>`;
        };

        const rows = all.length > 0 ? all.map((p, i) =>
            `<tr class="border-b border-white/[0.03] product-row">
                <td class="py-3 pl-3 text-xs font-mono ${i < 3 ? 'text-purple-400' : 'text-slate-600'}">${i+1}</td>
                <td class="py-3 text-sm text-slate-300 max-w-[280px] truncate">${esc(p.name)}</td>
                <td class="py-3">${channelBadge(p.channel)}</td>
                <td class="py-3 text-sm font-mono text-right text-slate-200">$${Number(p.revenue).toLocaleString('en-US',{minimumFractionDigits:2})}</td>
                <td class="py-3 text-sm font-mono text-right pr-3 text-slate-500">${p.units}</td>
            </tr>`
        ).join('') : '<tr><td colspan="5" class="py-10 text-center text-sm text-slate-600">No product data</td></tr>';

        return `<div class="col-span-2 glass p-5">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-sm font-semibold text-slate-200">Product Rankings</h2>

                <tbody>${rows}</tbody>
            </table>
        </div>`;
    }

    // ── Inventory Alerts ──
    function buildAlerts() {
        const alerts = DATA.inventory_alerts || [];
        const badge = alerts.length > 0
            ? `<span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-red-500/10 text-red-400">${alerts.length} alerts</span>`
            : `<span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-emerald-500/10 text-emerald-400">All clear</span>`;

        const items = alerts.length > 0 ? alerts.map(a => {
            const cls = a.severity === 'critical' ? 'status-bad' : 'status-warn';
            const name = a.product || a.name || a.sku;
            const status = a.severity === 'critical' ? '<span class="text-[10px] font-mono font-semibold text-red-400">OUT OF STOCK</span>' : `<span class="text-[10px] font-mono font-semibold text-amber-400">${a.inventory || a.fulfillable} left</span>`;
            return `<div class="px-3 py-2.5 rounded-lg bg-white/[0.02] text-xs ${cls}">
                <div class="flex items-center justify-between"><span class="text-slate-300 truncate max-w-[170px] font-medium">${esc(name)}</span>${status}</div>
                <p class="text-[10px] text-slate-600 mt-0.5">${esc(a.source)}</p>
            </div>`;
        }).join('') : '<div class="flex flex-col items-center py-6 text-slate-600"><svg class="w-6 h-6 mb-2 text-emerald-500/30" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><p class="text-xs">All stock levels healthy</p></div>';

        return `<div class="glass p-5">
            <div class="flex items-center justify-between mb-3"><h2 class="text-sm font-semibold text-slate-200">Inventory Alerts</h2>${badge}</div>
            <div class="space-y-2 max-h-44 overflow-y-auto">${items}</div>
        </div>`;
    }

    // ── Meta Campaigns ──
    function buildCampaigns() {
        const camps = (DATA.meta_campaigns || []).filter(c => c.spend > 0).slice(0, 5);
        const items = camps.length > 0 ? camps.map(c => {
            const roasColor = c.roas >= 2 ? 'text-emerald-400' : c.roas > 0 ? 'text-amber-400' : 'text-slate-600';
            const roasText = c.roas > 0 ? c.roas.toFixed(1) + 'x ROAS' : 'No sales';
            return `<div class="px-3 py-2.5 rounded-lg bg-white/[0.02] text-xs hover:bg-white/[0.04] transition-colors">
                <p class="text-slate-300 truncate font-medium">${esc(c.name)}</p>
                <div class="flex items-center gap-3 mt-1.5 text-[10px] font-mono text-slate-500">
                    <span>$${c.spend.toFixed(2)}</span>
                    <span class="${roasColor}">${roasText}</span>
                    <span>${c.purchases} sales</span>
                </div>
            </div>`;
        }).join('') : '<div class="flex flex-col items-center py-6 text-slate-600"><p class="text-xs">No active campaigns</p></div>';

        return `<div class="glass p-5">
            <div class="flex items-center justify-between mb-3"><h2 class="text-sm font-semibold text-slate-200">Meta Campaigns</h2><span class="text-[10px] font-mono text-slate-500">${camps.length} active</span></div>
            <div class="space-y-2 max-h-44 overflow-y-auto">${items}</div>
        </div>`;
    }

    // ── Channel Split Legend ──
    function buildChannelLegend() {
        const pcts = DATA.channel_pct || {};
        return Object.entries(pcts).map(([ch, pct]) => {
            const color = ch === 'Shopify' ? 'bg-purple-400' : ch === 'Amazon US' ? 'bg-cyan-400' : 'bg-pink-400';
            return `<div class="flex items-center justify-between text-xs"><div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full ${color}"></span><span class="text-slate-400">${ch}</span></div><span class="font-mono text-slate-300">${pct}%</span></div>`;
        }).join('');
    }

    // ── Sources Footer ──
    function buildSources() {
        const sources = DATA.sources || {};
        const dots = Object.entries(sources).map(([name, ok]) =>
            `<div class="flex items-center gap-1.5"><div class="w-1.5 h-1.5 rounded-full ${ok ? 'bg-emerald-400' : 'bg-red-400'}"></div><span class="text-[10px] font-mono text-slate-600 uppercase tracking-wide">${name}</span></div>`

        return `<div class="flex items-center justify-center gap-6 py-4 border-t border-white/[0.03]">${dots}<span class="text-[10px] text-slate-700 font-mono">Updated ${ts}</span></div>`;

    const efficiencyIcon = 'M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z';
    const healthIcon = 'M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z';

    content.innerHTML = `
        ${buildKpiRow('Revenue', revenueIcon, 'text-purple-400', 'revenue')}
        ${buildKpiRow('Efficiency', efficiencyIcon, 'text-cyan-400', 'efficiency')}
        ${buildKpiRow('Health', healthIcon, 'text-pink-400', 'health')}

        <div class="grid grid-cols-3 gap-4 chart-row">
            <div class="col-span-2 glass p-5">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-sm font-semibold text-slate-200">Revenue by Channel</h2>
                    <div class="flex items-center gap-5 text-[11px]">
                        <span class="flex items-center gap-1.5"><span class="w-3 h-[3px] rounded-full bg-purple-400 inline-block"></span><span class="text-slate-400">Shopify</span></span>
                        <span class="flex items-center gap-1.5"><span class="w-3 h-[3px] rounded-full bg-cyan-400 inline-block"></span><span class="text-slate-400">Amazon US</span></span>
                        <span class="flex items-center gap-1.5"><span class="w-3 h-[3px] rounded-full bg-pink-400 inline-block"></span><span class="text-slate-400">Amazon UK</span></span>
                    </div>
                </div>
                <div class="relative h-60"><canvas id="revenueChart"></canvas></div>
            </div>
            <div class="glass p-5">
                <h2 class="text-sm font-semibold text-slate-200 mb-4">Channel Split</h2>
                <div class="relative h-48 flex items-center justify-center">
                    <canvas id="channelChart"></canvas>
                    <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                        <span class="text-[10px] text-slate-500 font-mono">TOTAL</span>
                        <span class="text-lg font-bold font-mono text-white">${totalRev()}</span>
                    </div>
                </div>
                <div class="mt-4 space-y-2.5">${buildChannelLegend()}</div>
            </div>
        </div>

        <div class="grid grid-cols-3 gap-4 bottom-row">
            ${buildProductsTable()}
            <div class="space-y-4">
                ${buildAlerts()}
                ${buildCampaigns()}
            </div>
        </div>

        ${buildSources()}
    `;

    // ── Charts ──
    const series = DATA.daily_series || {};
    const dates = Object.keys(series).sort();
    const shortDates = dates.map(d => { const dt = new Date(d + 'T00:00:00'); return dt.toLocaleDateString('en-US', {month:'short', day:'numeric'}); });

    const mkDataset = (label, key, color, alpha) => ({
        label, data: dates.map(d => series[d]?.[key] || 0),
        borderColor: color, backgroundColor: color.slice(0,-1) + ', ' + alpha + ')',
        fill: true, tension: 0.4, borderWidth: 2, pointRadius: 0,
        pointHoverRadius: 5, pointHoverBackgroundColor: color, pointHoverBorderColor: '#000', pointHoverBorderWidth: 2,
    });

    const ttipStyle = { backgroundColor: 'rgba(0,0,0,0.9)', borderColor: 'rgba(139,92,246,0.2)', borderWidth: 1, titleColor: '#fff', bodyColor: '#94a3b8', titleFont: {family:'Fira Sans',size:12,weight:600}, bodyFont: {family:'Fira Code',size:11}, padding: 12, cornerRadius: 8 };

    if (dates.length > 0) {
        new Chart(document.getElementById('revenueChart'), {
            type: 'line',
            data: {
                labels: shortDates,
                datasets: [
                    mkDataset('Shopify', 'shopify', 'rgb(139,92,246)', 0.08),
                    mkDataset('Amazon US', 'amazon_us', 'rgb(6,182,212)', 0.06),
                    mkDataset('Amazon UK', 'amazon_uk', 'rgb(236,72,153)', 0.05),
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                interaction: {mode:'index', intersect:false},
                plugins: { legend: {display:false}, tooltip: {...ttipStyle, displayColors:true, boxWidth:8, boxHeight:8, callbacks: { label: ctx => ` ${ctx.dataset.label}: $${ctx.parsed.y.toLocaleString('en-US',{minimumFractionDigits:2})}` } } },
                scales: {
                    x: { ticks: {color:'#334155', font:{family:'Fira Sans',size:10}, maxRotation:0, maxTicksLimit:8}, grid: {color:'rgba(255,255,255,0.02)'}, border: {display:false} },
                    y: { ticks: {color:'#334155', font:{family:'Fira Code',size:10}, callback: v => '$'+(v>=1000?(v/1000).toFixed(0)+'k':v)}, grid: {color:'rgba(255,255,255,0.02)'}, border: {display:false} },
                },
            }
        });
    }

    const bd = DATA.channel_breakdown || {};
    if (Object.keys(bd).length > 0) {
        new Chart(document.getElementById('channelChart'), {
            type: 'doughnut',
            data: { labels: Object.keys(bd), datasets: [{ data: Object.values(bd), backgroundColor: ['#8b5cf6','#06b6d4','#ec4899'], borderColor: '#000', borderWidth: 3, hoverOffset: 8 }] },
            options: { responsive: true, maintainAspectRatio: false, cutout: '72%', plugins: { legend: {display:false}, tooltip: {...ttipStyle, callbacks: { label: ctx => ` $${ctx.parsed.toLocaleString('en-US',{minimumFractionDigits:2})}` } } } },
        });
    }

    // ── Period buttons (visual only in static mode) ──
    const sel = document.getElementById('period-selector');
    ['7D','30D','90D','6M'].forEach((label, i) => {
        const active = label === DATA.period_days + 'D' || (label === '6M' && DATA.period_days === 180);
        const btn = document.createElement('button');
        btn.textContent = label;
        btn.className = `px-3 py-1.5 text-xs font-medium rounded-md cursor-pointer transition-all ${active ? 'bg-purple-500/15 text-purple-400' : 'text-slate-500 hover:text-slate-300'}`;
        sel.appendChild(btn);
    });

})();
</script>

</body>
</html>
