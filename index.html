<script>
(function() {
    var DATA = window.__HERMES_DATA__;
    if (!DATA) {
        document.getElementById('dashboard-content').innerHTML = '<p class="text-red-500 text-center py-20 text-sm">No data available. Generate with: python generate_dashboard.py --demo</p>';
        return;
    }

    var activeTab = 'overview';
    var chartInstances = [];

    // ── Helpers ──

    function destroyCharts() {
        chartInstances.forEach(function(c) { c.destroy(); });
        chartInstances = [];
    }

    function fmt(value, format) {
        if (value === null || value === undefined) return '\u2014';
        switch (format) {
            case 'currency': return '$' + Number(value).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            case 'currency_compact': return value >= 10000 ? '$' + (value/1000).toFixed(1) + 'k' : '$' + Number(value).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            case 'currency_gbp': return '\u00A3' + Number(value).toLocaleString('en-GB', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            case 'currency_gbp_compact': return value >= 10000 ? '\u00A3' + (value/1000).toFixed(1) + 'k' : '\u00A3' + Number(value).toLocaleString('en-GB', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            case 'multiplier': return Number(value).toFixed(2) + 'x';
            case 'percent': return Number(value).toFixed(1) + '%';
            case 'number': return Number(value).toLocaleString();
            case 'status': return String(value);
            default: return String(value);
        }
    }

    function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    function buildSparkline(data, color) {
        if (!data || data.length < 2) return '';
        var w = 64, h = 28, pad = 2;
        var min = Math.min.apply(null, data);
        var max = Math.max.apply(null, data);
        var range = max - min || 1;
        var points = data.map(function(v, i) {
            var x = pad + (i / (data.length - 1)) * (w - pad * 2);
            var y = pad + (1 - (v - min) / range) * (h - pad * 2);
            return x.toFixed(1) + ',' + y.toFixed(1);
        }).join(' ');
        return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" fill="none">' +
            '<polyline points="' + points + '" stroke="' + color + '" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>' +
            '</svg>';
    }

    function buildChangeBadge(change, invert) {
        if (change === null || change === undefined) return '';
        var isUp = invert ? change < 0 : change > 0;
        var isDown = invert ? change > 0 : change < 0;
        var cls = change === 0 ? 'change-flat' : isUp ? 'change-up' : 'change-down';
        var arrow = change === 0 ? '' : change > 0 ? '\u2191' : '\u2193';
        var sign = change > 0 ? '+' : '';
        return '<span class="change-badge ' + cls + '">' + arrow + ' ' + sign + change.toFixed(1) + '%</span>';
    }

    function sparkColor(change, invert) {
        if (change === null || change === undefined || change === 0) return '#94A3B8';
        var isUp = invert ? change < 0 : change > 0;
        return isUp ? '#16A34A' : '#DC2626';
    }

    function buildGoalBar(kpi) {
        if (!kpi.target || kpi.progress === undefined) return '';
        var pct = Math.min(kpi.progress, 100);
        return '<div class="mt-3">' +
            '<div class="h-1.5 bg-gray-100 rounded-full overflow-hidden">' +
                '<div class="h-full bg-blue-500 rounded-full" style="width:' + pct + '%"></div>' +
            '</div>' +
            '<p class="text-[11px] text-slate-400 mt-1 font-mono">' + pct.toFixed(1) + '% of ' +
            (kpi.format === 'currency_gbp' ? '\u00A3' : '$') + (kpi.target >= 1000 ? (kpi.target/1000).toFixed(0) + 'k' : kpi.target) + ' target</p>' +
        '</div>';
    }

    // ── KPI Card ──

    function buildKpiCard(kpi) {
        var isHero = kpi.hero;
        var cls = isHero ? 'card hero' : 'card';
        var sc = sparkColor(kpi.change, kpi.invert);
        var valueSz = isHero ? 'text-3xl' : 'text-2xl';

        return '<div class="' + cls + '">' +
            '<div class="flex items-center justify-between mb-3">' +
                '<span class="text-xs font-medium text-slate-500 uppercase tracking-wide">' + esc(kpi.label) + '</span>' +
                buildChangeBadge(kpi.change, kpi.invert) +
            '</div>' +
            '<div class="flex items-end justify-between">' +
                '<span class="' + valueSz + ' font-semibold font-mono text-slate-900">' + fmt(kpi.value, kpi.format) + '</span>' +
                '<div class="flex-shrink-0">' + buildSparkline(kpi.sparkline, sc) + '</div>' +
            '</div>' +
            (kpi.detail ? '<p class="text-[11px] text-slate-400 mt-1">' + esc(kpi.detail) + '</p>' : '') +
            buildGoalBar(kpi) +
        '</div>';
    }

    // ── Headline Strip ──

    function buildHeadlineStrip(items) {
        var cards = items.map(function(item) {
            var badge = '';
            if (item.change !== null && item.change !== undefined) {
                badge = buildChangeBadge(item.change, item.invert);
            } else if (item.status) {
                var sCls = item.status === 'warning' ? 'bg-amber-50 text-amber-600' : item.status === 'critical' ? 'bg-red-50 text-red-600' : 'bg-green-50 text-green-600';
                badge = '<span class="change-badge ' + sCls + '">' + esc(item.detail || '') + '</span>';
            }
            return '<div class="card">' +
                '<div class="text-[32px] font-semibold font-mono text-slate-900 leading-tight">' + fmt(item.value, item.format) + '</div>' +
                '<div class="flex items-center justify-between mt-2">' +
                    '<span class="text-xs font-medium text-slate-500 uppercase tracking-wide">' + esc(item.label) + '</span>' +
                    badge +
                '</div>' +
            '</div>';
        }).join('');
        return '<div class="grid grid-cols-2 md:grid-cols-4 gap-4">' + cards + '</div>';
    }

    // ── KPI Grid ──

    function buildKpiGrid(kpis, group, title) {
        var filtered = kpis.filter(function(k) { return k.group === group; });
        if (filtered.length === 0) return '';
        var cards = filtered.map(function(k) { return buildKpiCard(k); }).join('');
        return '<div>' +
            '<h2 class="text-[15px] font-semibold text-slate-900 mb-3">' + esc(title) + '</h2>' +
            '<div class="grid grid-cols-5 gap-4 kpi-grid">' + cards + '</div>' +
        '</div>';
    }

    // ── Channel Badge ──

    function channelBadge(ch) {
        var cls = ch === 'Shopify' ? 'bg-purple-50 text-purple-600' : ch === 'Amazon US' ? 'bg-blue-50 text-blue-600' : 'bg-pink-50 text-pink-600';
        return '<span class="text-xs font-mono px-2 py-0.5 rounded ' + cls + '">' + esc(ch) + '</span>';
    }

    function trendIcon(t) {
        if (t === 'up') return '<span class="text-green-600 text-sm">\u2191</span>';
        if (t === 'down') return '<span class="text-red-600 text-sm">\u2193</span>';
        return '<span class="text-slate-400 text-sm">\u2192</span>';
    }

    // ── Products Table ──

    function buildProductsTable(products, title, showChannel, showBsr) {
        if (!products || products.length === 0) return '';
        var headers = '<th class="text-left pb-3 pl-3 w-8">#</th><th class="text-left pb-3">Product</th>';
        if (showChannel) headers += '<th class="text-left pb-3">Channel</th>';
        headers += '<th class="text-right pb-3">Revenue</th><th class="text-right pb-3">Units</th>';
        if (showBsr) headers += '<th class="text-right pb-3">BSR</th>';
        headers += '<th class="text-right pb-3">CVR</th><th class="text-center pb-3 w-8">Trend</th>';

        var rows = products.map(function(p, i) {
            var cvr = p.conversion_rate ? p.conversion_rate.toFixed(1) + '%' : '\u2014';
            var rankCls = i < 3 ? 'text-blue-600 font-semibold' : 'text-slate-400';
            var row = '<td class="py-3 pl-3 text-xs font-mono ' + rankCls + '">' + (i + 1) + '</td>' +
                '<td class="py-3 text-sm text-slate-700 max-w-[240px] truncate">' + esc(p.name) + '</td>';
            if (showChannel) row += '<td class="py-3">' + channelBadge(p.channel) + '</td>';
            row += '<td class="py-3 text-sm font-mono text-right text-slate-900">$' + Number(p.revenue).toLocaleString('en-US', {minimumFractionDigits: 2}) + '</td>' +
                '<td class="py-3 text-sm font-mono text-right text-slate-500">' + p.units + '</td>';
            if (showBsr) row += '<td class="py-3 text-sm font-mono text-right text-slate-400">#' + (p.bsr || '\u2014') + '</td>';
            row += '<td class="py-3 text-sm font-mono text-right text-slate-500">' + cvr + '</td>' +
                '<td class="py-3 text-center">' + trendIcon(p.trend) + '</td>';
            return '<tr class="border-b border-gray-50 product-row">' + row + '</tr>';
        }).join('');

        return '<div class="card">' +
            '<div class="flex items-center justify-between mb-4">' +
                '<h2 class="text-[15px] font-semibold text-slate-900">' + esc(title) + '</h2>' +
                '<span class="text-xs font-mono text-slate-400 bg-slate-50 px-2 py-1 rounded">' + products.length + ' items</span>' +
            '</div>' +
            '<div class="overflow-x-auto">' +
            '<table class="w-full">' +
                '<thead><tr class="text-xs font-medium text-slate-400 uppercase tracking-wider border-b border-slate-100">' + headers + '</tr></thead>' +
                '<tbody>' + rows + '</tbody>' +
            '</table></div>' +
        '</div>';
    }

    // ── Inventory Alerts ──

    function buildAlerts(alerts, title) {
        if (!alerts) alerts = [];
        var badge = alerts.length > 0
            ? '<span class="text-xs font-mono px-2 py-0.5 rounded-full bg-red-50 text-red-600">' + alerts.length + ' alert' + (alerts.length > 1 ? 's' : '') + '</span>'
            : '<span class="text-xs font-mono px-2 py-0.5 rounded-full bg-green-50 text-green-600">All clear</span>';

        var items;
        if (alerts.length > 0) {
            items = alerts.map(function(a) {
                var isCritical = a.severity === 'critical';
                var borderCls = isCritical ? 'status-critical' : 'status-warning';
                var name = a.product || a.name || a.sku;
                var chip = isCritical
                    ? '<span class="text-xs font-medium px-2 py-0.5 rounded-full bg-red-50 text-red-600">OUT OF STOCK</span>'
                    : '<span class="text-xs font-medium px-2 py-0.5 rounded-full bg-amber-50 text-amber-600">' + (a.inventory || 0) + ' left</span>';
                return '<div class="px-3 py-2.5 rounded-lg bg-slate-50 ' + borderCls + '">' +
                    '<div class="flex items-center justify-between"><span class="text-sm text-slate-700 truncate max-w-[180px] font-medium">' + esc(name) + '</span>' + chip + '</div>' +
                    '<p class="text-[11px] text-slate-400 mt-0.5">' + esc(a.source || '') + (a.sku ? ' \u00B7 ' + esc(a.sku) : '') + '</p>' +
                '</div>';
            }).join('');
        } else {
            items = '<div class="flex flex-col items-center py-6 text-slate-400">' +
                '<svg class="w-8 h-8 mb-2 text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>' +
                '<p class="text-sm">All stock levels healthy</p></div>';
        }

        return '<div class="card">' +
            '<div class="flex items-center justify-between mb-3"><h2 class="text-[15px] font-semibold text-slate-900">' + esc(title || 'Inventory Alerts') + '</h2>' + badge + '</div>' +
            '<div class="space-y-2 max-h-60 overflow-y-auto">' + items + '</div>' +
        '</div>';
    }

    // ── Meta Campaigns ──

    function buildCampaigns(campaigns) {
        if (!campaigns || campaigns.length === 0) return '';
        var items = campaigns.map(function(c) {
            var roasColor = c.roas >= 2 ? 'text-green-600' : c.roas >= 1 ? 'text-amber-600' : 'text-red-600';
            return '<div class="px-3 py-2.5 rounded-lg bg-slate-50 hover:bg-blue-50/50 transition-colors">' +
                '<p class="text-sm text-slate-700 truncate font-medium">' + esc(c.name) + '</p>' +
                '<div class="flex items-center gap-3 mt-1.5 text-[11px] font-mono text-slate-500">' +
                    '<span>$' + c.spend.toFixed(2) + '</span>' +
                    '<span class="' + roasColor + '">' + c.roas.toFixed(1) + 'x ROAS</span>' +
                    '<span>' + c.purchases + ' sales</span>' +
                '</div>' +
            '</div>';
        }).join('');

        return '<div class="card">' +
            '<div class="flex items-center justify-between mb-3"><h2 class="text-[15px] font-semibold text-slate-900">Meta Campaigns</h2><span class="text-xs font-mono text-slate-400">' + campaigns.length + ' active</span></div>' +
            '<div class="space-y-2 max-h-60 overflow-y-auto">' + items + '</div>' +
        '</div>';
    }

    // ── Landing Pages Table ──

    function buildLandingPages(pages) {
        if (!pages || pages.length === 0) return '';
        var rows = pages.map(function(p) {
            return '<tr class="border-b border-gray-50 product-row">' +
                '<td class="py-2.5 text-sm text-blue-600 font-mono truncate max-w-[200px]">' + esc(p.page) + '</td>' +
                '<td class="py-2.5 text-sm font-mono text-right text-slate-700">' + Number(p.sessions).toLocaleString() + '</td>' +
                '<td class="py-2.5 text-sm font-mono text-right text-slate-500">' + p.conversion_rate.toFixed(1) + '%</td>' +
                '<td class="py-2.5 text-sm font-mono text-right text-slate-900">$' + Number(p.revenue).toLocaleString('en-US', {minimumFractionDigits: 2}) + '</td>' +
            '</tr>';
        }).join('');

        return '<div class="card">' +
            '<h2 class="text-[15px] font-semibold text-slate-900 mb-4">Top Landing Pages</h2>' +
            '<div class="overflow-x-auto"><table class="w-full">' +
                '<thead><tr class="text-xs font-medium text-slate-400 uppercase tracking-wider border-b border-slate-100">' +
                    '<th class="text-left pb-3">Page</th><th class="text-right pb-3">Sessions</th><th class="text-right pb-3">CVR</th><th class="text-right pb-3">Revenue</th>' +
                '</tr></thead>' +
                '<tbody>' + rows + '</tbody>' +
            '</table></div>' +
        '</div>';
    }

    // ── Pulse Summary ──

    function buildPulseSummary(view) {
        var parts = [];
        var headline = view.headline || [];
        var revItem = headline[0];
        if (revItem && revItem.change) {
            var dir = revItem.change > 0 ? 'up' : revItem.change < 0 ? 'down' : 'flat';
            parts.push('Revenue ' + dir + ' ' + Math.abs(revItem.change).toFixed(1) + '% WoW');
        }
        var alerts = view.inventory_alerts || [];
        var critCount = alerts.filter(function(a) { return a.severity === 'critical'; }).length;
        var warnCount = alerts.filter(function(a) { return a.severity === 'warning'; }).length;
        if (critCount + warnCount > 0) {
            parts.push((critCount + warnCount) + ' item' + (critCount + warnCount > 1 ? 's' : '') + ' need restocking');
        }
        var kpis = view.kpis || [];
        var roasKpi = kpis.find(function(k) { return k.key === 'meta_roas'; });
        if (roasKpi && roasKpi.value) {
            parts.push('Meta ROAS at ' + roasKpi.value.toFixed(1) + 'x');
        }
        if (parts.length === 0) return '';
        return '<div class="card" style="background: #EFF6FF; border-color: #BFDBFE;">' +
            '<p class="text-sm text-blue-700 text-center">' +
            parts.join(' <span class="text-blue-300 mx-1">|</span> ') +
            '</p></div>';
    }

    // ── Heatmap ──

    function buildHeatmap(dailySeries) {
        if (!dailySeries) return '';
        var dates = Object.keys(dailySeries).sort();
        if (dates.length === 0) return '';

        var dailyTotals = {};
        var maxRev = 0;
        dates.forEach(function(d) {
            var day = dailySeries[d];
            var total = (day.shopify || 0) + (day.amazon_us || 0) + (day.amazon_uk || 0);
            dailyTotals[d] = total;
            if (total > maxRev) maxRev = total;
        });

        function cellColor(val) {
            if (maxRev === 0) return '#F1F5F9';
            var intensity = val / maxRev;
            if (intensity < 0.15) return '#EFF6FF';
            if (intensity < 0.35) return '#BFDBFE';
            if (intensity < 0.55) return '#93C5FD';
            if (intensity < 0.75) return '#60A5FA';
            return '#2563EB';
        }

        var lastDate = new Date(dates[dates.length - 1] + 'T00:00:00');
        var dayOfWeek = lastDate.getDay();
        var totalCells = 35;
        var startOffset = totalCells - dates.length - (6 - dayOfWeek);

        var cells = [];
        for (var i = 0; i < totalCells; i++) {
            var dateIdx = i - Math.max(0, startOffset);
            var dateStr = dateIdx >= 0 && dateIdx < dates.length ? dates[dateIdx] : null;
            var val = dateStr ? dailyTotals[dateStr] || 0 : 0;
            var bg = dateStr ? cellColor(val) : '#F8FAFC';
            var title = dateStr ? dateStr + ': $' + val.toFixed(0) : '';
            cells.push('<div class="heatmap-cell" style="background:' + bg + ';" title="' + title + '"></div>');
        }

        var weeks = [];
        for (var w = 0; w < 5; w++) {
            var weekCells = '';
            for (var d = 0; d < 7; d++) { weekCells += cells[w * 7 + d]; }
            weeks.push('<div class="flex flex-col gap-[3px]">' + weekCells + '</div>');
        }

        var dayLabels = '<div class="flex flex-col gap-[3px] mr-1.5 text-[9px] font-mono text-slate-400">' +
            ['S','M','T','W','T','F','S'].map(function(l) { return '<div style="height:14px;line-height:14px;">' + l + '</div>'; }).join('') + '</div>';

        var legend = '<div class="flex items-center gap-1 mt-3 text-[10px] text-slate-400 font-mono">' +
            '<span>Less</span>' +
            ['#EFF6FF','#BFDBFE','#93C5FD','#60A5FA','#2563EB'].map(function(c) { return '<div class="heatmap-cell" style="background:' + c + ';width:10px;height:10px;"></div>'; }).join('') +
            '<span>More</span></div>';

        return '<div class="card">' +
            '<h2 class="text-[15px] font-semibold text-slate-900 mb-3">Daily Revenue</h2>' +
            '<div class="flex items-start">' + dayLabels + '<div class="flex gap-[3px]">' + weeks.join('') + '</div></div>' +
            legend + '</div>';
    }

    // ── Channel Legend ──

    function buildChannelLegend(channelPct) {
        if (!channelPct) return '';
        var colors = {'Shopify': 'bg-purple-500', 'Amazon US': 'bg-blue-500', 'Amazon UK': 'bg-pink-500'};
        return Object.keys(channelPct).map(function(ch) {
            return '<div class="flex items-center justify-between text-sm"><div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full ' + (colors[ch] || 'bg-slate-400') + '"></span><span class="text-slate-600">' + ch + '</span></div><span class="font-mono text-slate-900">' + channelPct[ch] + '%</span></div>';
        }).join('');
    }

    // ── Sources Footer ──

    function buildSources() {
        var sources = DATA.sources || {};
        var dots = Object.keys(sources).map(function(name) {
            var ok = sources[name];
            return '<div class="flex items-center gap-1.5"><div class="w-1.5 h-1.5 rounded-full ' + (ok ? 'bg-green-500' : 'bg-red-500') + '"></div><span class="text-[11px] font-mono text-slate-400 uppercase tracking-wide">' + name + '</span></div>';
        }).join('');
        var ts = DATA.generated_at ? new Date(DATA.generated_at).toLocaleString('en-GB', {day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'}) : '';
        return '<div class="flex items-center justify-center gap-6 py-4 border-t border-slate-200 mt-6">' + dots + '<span class="text-[11px] text-slate-400 font-mono">Updated ' + ts + '</span></div>';
    }

    // ── Skeleton ──

    function buildSkeleton() {
        var skCards = '';
        for (var i = 0; i < 4; i++) { skCards += '<div class="skeleton h-24 rounded-xl"></div>'; }
        var skKpis = '';
        for (var j = 0; j < 5; j++) { skKpis += '<div class="skeleton h-28 rounded-xl"></div>'; }
        return '<div class="grid grid-cols-2 md:grid-cols-4 gap-4">' + skCards + '</div>' +
            '<div class="skeleton h-4 w-2/3 mx-auto rounded mt-6"></div>' +
            '<div class="grid grid-cols-5 gap-4 kpi-grid mt-6">' + skKpis + '</div>' +
            '<div class="skeleton h-72 rounded-xl mt-6"></div>';
    }

    // ── Chart Helpers ──

    var chartTooltipStyle = {
        backgroundColor: '#FFFFFF',
        titleColor: '#0F172A',
        bodyColor: '#475569',
        borderColor: '#E2E8F0',
        borderWidth: 1,
        titleFont: {family: 'Inter', size: 12, weight: '600'},
        bodyFont: {family: 'Fira Code', size: 11},
        padding: 12,
        cornerRadius: 12,
        boxPadding: 4
    };

    function makeGradient(ctx, hex, h) {
        var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
        var grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, 'rgba(' + r + ',' + g + ',' + b + ',0.1)');
        grad.addColorStop(1, 'rgba(' + r + ',' + g + ',' + b + ',0)');
        return grad;
    }

    function buildLineChart(canvasId, labels, datasets) {
        var el = document.getElementById(canvasId);
        if (!el) return;
        var ctx = el.getContext('2d');
        var ds = datasets.map(function(d) {
            return {
                label: d.label,
                data: d.data,
                borderColor: d.color,
                backgroundColor: makeGradient(ctx, d.color, el.parentElement.clientHeight || 288),
                fill: true,
                tension: 0.35,
                borderWidth: 2,
                pointRadius: 0,
                pointHoverRadius: 5,
                pointHoverBackgroundColor: d.color,
                pointHoverBorderColor: '#FFFFFF',
                pointHoverBorderWidth: 2
            };
        });
        var chart = new Chart(ctx, {
            type: 'line',
            data: { labels: labels, datasets: ds },
            options: {
                responsive: true, maintainAspectRatio: false,
                interaction: {mode: 'index', intersect: false},
                plugins: {
                    legend: {display: false},
                    tooltip: Object.assign({}, chartTooltipStyle, {
                        displayColors: true, boxWidth: 8, boxHeight: 8,
                        callbacks: { label: function(ctx) { return ' ' + ctx.dataset.label + ': $' + ctx.parsed.y.toLocaleString('en-US', {minimumFractionDigits: 2}); } }
                    })
                },
                scales: {
                    x: { ticks: {color: '#94A3B8', font: {family: 'Inter', size: 11}, maxRotation: 0, maxTicksLimit: 8}, grid: {color: '#F1F5F9'}, border: {display: false} },
                    y: { ticks: {color: '#94A3B8', font: {family: 'Fira Code', size: 11}, callback: function(v) { return '$' + (v >= 1000 ? (v/1000).toFixed(0) + 'k' : v); }}, grid: {color: '#F1F5F9'}, border: {display: false} }
                }
            }
        });
        chartInstances.push(chart);
    }

    function buildDonutChart(canvasId, labels, values, colors) {
        var el = document.getElementById(canvasId);
        if (!el) return;
        var chart = new Chart(el, {
            type: 'doughnut',
            data: {
                labels: labels,
                datasets: [{
                    data: values,
                    backgroundColor: colors,
                    borderColor: '#FFFFFF',
                    borderWidth: 4,
                    hoverOffset: 8
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                cutout: '70%',
                plugins: {
                    legend: {display: false},
                    tooltip: Object.assign({}, chartTooltipStyle, {
                        callbacks: { label: function(ctx) { return ' $' + ctx.parsed.toLocaleString('en-US', {minimumFractionDigits: 2}); } }
                    })
                }
            }
        });
        chartInstances.push(chart);
    }

    // ── Total Revenue ──

    function totalRevStr(bd) {
        var t = Object.values(bd).reduce(function(s, v) { return s + v; }, 0);
        return t >= 1000 ? '$' + (t / 1000).toFixed(1) + 'k' : '$' + t.toFixed(0);
    }

    // ── Render: Overview ──

    function renderOverview(view) {
        var content = document.getElementById('dashboard-content');
        var series = view.daily_series || {};
        var dates = Object.keys(series).sort();
        var shortDates = dates.map(function(d) { var dt = new Date(d + 'T00:00:00'); return dt.toLocaleDateString('en-US', {month: 'short', day: 'numeric'}); });
        var bd = view.channel_breakdown || {};
        var chartId = 'rev-chart-' + Date.now();
        var donutId = 'donut-chart-' + Date.now();

        var html = buildHeadlineStrip(view.headline || []) +
            buildPulseSummary(view) +
            buildKpiGrid(view.kpis, 'revenue', 'Revenue') +
            buildKpiGrid(view.kpis, 'efficiency', 'Efficiency') +
            buildKpiGrid(view.kpis, 'health', 'Health') +

            '<div class="grid grid-cols-3 gap-4 chart-row">' +
                '<div class="col-span-2 card">' +
                    '<div class="flex items-center justify-between mb-4">' +
                        '<h2 class="text-[15px] font-semibold text-slate-900">Revenue by Channel</h2>' +
                        '<div class="flex items-center gap-5 text-xs">' +
                            '<span class="flex items-center gap-1.5"><span class="w-3 h-[3px] rounded-full bg-purple-500 inline-block"></span><span class="text-slate-500">Shopify</span></span>' +
                            '<span class="flex items-center gap-1.5"><span class="w-3 h-[3px] rounded-full bg-blue-500 inline-block"></span><span class="text-slate-500">Amazon US</span></span>' +
                            '<span class="flex items-center gap-1.5"><span class="w-3 h-[3px] rounded-full bg-pink-500 inline-block"></span><span class="text-slate-500">Amazon UK</span></span>' +
                        '</div>' +
                    '</div>' +
                    '<div class="relative h-72"><canvas id="' + chartId + '"></canvas></div>' +
                '</div>' +
                '<div class="card">' +
                    '<h2 class="text-[15px] font-semibold text-slate-900 mb-4">Channel Split</h2>' +
                    '<div class="relative h-56 flex items-center justify-center">' +
                        '<canvas id="' + donutId + '"></canvas>' +
                        '<div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">' +
                            '<span class="text-[10px] text-slate-400 font-mono uppercase tracking-wider">Total</span>' +
                            '<span class="text-xl font-semibold font-mono text-slate-900">' + totalRevStr(bd) + '</span>' +
                        '</div>' +
                    '</div>' +
                    '<div class="mt-4 space-y-2.5">' + buildChannelLegend(view.channel_pct) + '</div>' +
                '</div>' +
            '</div>' +

            '<div class="grid grid-cols-3 gap-4 products-row">' +
                '<div class="col-span-2">' + buildProductsTable(view.top_products, 'Top Products', true, false) + '</div>' +
                '<div class="space-y-4">' +
                    buildAlerts(view.inventory_alerts, 'Inventory Alerts') +
                    buildCampaigns(view.meta_campaigns) +
                '</div>' +
            '</div>' +

            '<div class="grid grid-cols-3 gap-4 bottom-row">' +
                '<div class="col-span-2">' + buildProductsTable(view.bottom_products, 'Bottom Performers', true, false) + '</div>' +
                buildHeatmap(view.daily_series) +
            '</div>' +

            buildSources();

        content.innerHTML = html;

        // Charts
        if (dates.length > 0) {
            buildLineChart(chartId, shortDates, [
                {label: 'Shopify', data: dates.map(function(d) { return series[d].shopify || 0; }), color: '#8B5CF6'},
                {label: 'Amazon US', data: dates.map(function(d) { return series[d].amazon_us || 0; }), color: '#2563EB'},
                {label: 'Amazon UK', data: dates.map(function(d) { return series[d].amazon_uk || 0; }), color: '#EC4899'}
            ]);
        }
        if (Object.keys(bd).length > 0) {
            buildDonutChart(donutId, Object.keys(bd), Object.values(bd), ['#8B5CF6', '#2563EB', '#EC4899']);
        }
    }

    // ── Render: Channel Tab (Amazon US, Amazon UK) ──

    function renderChannel(view, name, color) {
        var content = document.getElementById('dashboard-content');
        var series = view.daily_series || {};
        var dates = Object.keys(series).sort();
        var shortDates = dates.map(function(d) { var dt = new Date(d + 'T00:00:00'); return dt.toLocaleDateString('en-US', {month: 'short', day: 'numeric'}); });
        var chartId = 'channel-chart-' + Date.now();
        var isUK = name === 'Amazon UK';

        // Determine KPI groups from data
        var groups = [];
        var kpis = view.kpis || [];
        var seen = {};
        kpis.forEach(function(k) { if (k.group && !seen[k.group]) { seen[k.group] = true; groups.push(k.group); } });

        var html = buildHeadlineStrip(view.headline || []);

        groups.forEach(function(g) {
            var title = g.charAt(0).toUpperCase() + g.slice(1);
            html += buildKpiGrid(kpis, g, title);
        });

        html += '<div class="card">' +
            '<div class="flex items-center justify-between mb-4">' +
                '<h2 class="text-[15px] font-semibold text-slate-900">Daily Revenue</h2>' +
            '</div>' +
            '<div class="relative h-72"><canvas id="' + chartId + '"></canvas></div>' +
        '</div>';

        html += buildProductsTable(view.top_products, name + ' Products', false, !!(view.top_products && view.top_products[0] && view.top_products[0].bsr));
        html += buildAlerts(view.inventory_alerts, name + ' Inventory');
        html += buildSources();

        content.innerHTML = html;

        if (dates.length > 0) {
            buildLineChart(chartId, shortDates, [
                {label: 'Revenue', data: dates.map(function(d) { return (series[d] || {}).revenue || 0; }), color: color}
            ]);
        }
    }

    // ── Render: Shopify Tab ──

    function renderShopify(view) {
        var content = document.getElementById('dashboard-content');
        var series = view.daily_series || {};
        var dates = Object.keys(series).sort();
        var shortDates = dates.map(function(d) { var dt = new Date(d + 'T00:00:00'); return dt.toLocaleDateString('en-US', {month: 'short', day: 'numeric'}); });
        var chartId = 'shopify-chart-' + Date.now();

        var kpis = view.kpis || [];
        var groups = [];
        var seen = {};
        kpis.forEach(function(k) { if (k.group && !seen[k.group]) { seen[k.group] = true; groups.push(k.group); } });

        var html = buildHeadlineStrip(view.headline || []);

        groups.forEach(function(g) {
            var title = g.charAt(0).toUpperCase() + g.slice(1);
            html += buildKpiGrid(kpis, g, title);
        });

        html += '<div class="card">' +
            '<div class="flex items-center justify-between mb-4">' +
                '<h2 class="text-[15px] font-semibold text-slate-900">Daily Revenue</h2>' +
            '</div>' +
            '<div class="relative h-72"><canvas id="' + chartId + '"></canvas></div>' +
        '</div>';

        html += buildProductsTable(view.top_products, 'Shopify Products', false, false);
        html += buildLandingPages(view.top_landing_pages);
        html += buildAlerts(view.inventory_alerts, 'Shopify Inventory');
        html += buildSources();

        content.innerHTML = html;

        if (dates.length > 0) {
            buildLineChart(chartId, shortDates, [
                {label: 'Revenue', data: dates.map(function(d) { return (series[d] || {}).revenue || 0; }), color: '#8B5CF6'}
            ]);
        }
    }

    // ── Tab Switching ──

    function switchTab(tab) {
        activeTab = tab;
        destroyCharts();

        document.querySelectorAll('.channel-tab').forEach(function(btn) {
            var isActive = btn.dataset.tab === tab;
            if (isActive) {
                btn.classList.add('tab-active');
            } else {
                btn.classList.remove('tab-active');
            }
        });

        var view = DATA.views ? DATA.views[tab] : null;
        if (!view) {
            document.getElementById('dashboard-content').innerHTML = '<p class="text-slate-400 text-center py-20 text-sm">No data for this view.</p>';
            return;
        }

        var content = document.getElementById('dashboard-content');
        content.innerHTML = buildSkeleton();

        setTimeout(function() {
            switch (tab) {
                case 'overview': renderOverview(view); break;
                case 'amazon_us': renderChannel(view, 'Amazon US', '#2563EB'); break;
                case 'amazon_uk': renderChannel(view, 'Amazon UK', '#EC4899'); break;
                case 'shopify': renderShopify(view); break;
            }
        }, 80);
    }

    // ── Init ──

    // Date range
    if (DATA.generated_at) {
        var end = new Date(DATA.generated_at);
        var start = new Date(end);
        start.setDate(start.getDate() - (DATA.period_days || 30));
        var opts = {month: 'short', day: 'numeric'};
        var el = document.getElementById('date-range');
        if (el) el.textContent = start.toLocaleDateString('en-US', opts) + ' \u2013 ' + end.toLocaleDateString('en-US', opts);
    }

    // Period selector
    var sel = document.getElementById('period-selector');
    ['7D', '30D', '90D'].forEach(function(label) {
        var active = label === DATA.period_days + 'D';
        var btn = document.createElement('button');
        btn.textContent = label;
        btn.className = 'px-3 py-1.5 text-xs font-medium rounded-md cursor-pointer transition-all ' + (active ? 'period-active' : 'text-slate-500 hover:text-slate-700');
        sel.appendChild(btn);
    });

    // Export
    document.getElementById('export-btn').addEventListener('click', function() { window.print(); });

    // Tab listeners
    document.querySelectorAll('.channel-tab').forEach(function(btn) {
        btn.addEventListener('click', function() {
            switchTab(btn.dataset.tab);
        });
    });

    // Initial render
    switchTab('overview');

})();
</script>

</body>
</html>
