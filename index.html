    <style>
        /* ═══ Design System: Dark Premium ═══
           Source: Gemini Pro analysis of Stockify (1.8K), E-CART Dark, Financial Dashboard
           Page bg: #0F1117 (dark with blue tint)
           Card bg: #1A1D27, hover: #1F2333
           Accents: Purple #8B5CF6, Cyan #06B6D4
           Radius: 16px, Gap: 20px, Padding: 24px
           No borders, no shadows. Depth via color only. */

        body { background: #0F1117; -webkit-font-smoothing: antialiased; }

        .card {
            background: #1A1D27;
            border: none;
            border-radius: 16px;
            padding: 24px;
            transition: background 0.2s ease;
        }
        .card:hover { background: #1F2333; }

        /* Accent card variants - used sparingly */
        .card-hero {
            background: linear-gradient(135deg, #1E1B4B 0%, #1A1D27 100%);
        }
        .card-hero:hover { background: linear-gradient(135deg, #23205A 0%, #1F2333 100%); }

        .change-badge {
            display: inline-flex; align-items: center; gap: 3px;
            font-size: 11px; font-family: 'Fira Code', monospace; font-weight: 600;
            padding: 4px 10px; border-radius: 8px;
        }
        .change-up { background: rgba(34,197,94,0.15); color: #4ADE80; }
        .change-down { background: rgba(239,68,68,0.15); color: #F87171; }
        .change-flat { background: rgba(148,163,184,0.1); color: #64748B; }

        .tab-active { color: #8B5CF6 !important; border-bottom: 2px solid #8B5CF6; font-weight: 600 !important; }

        .status-critical { border-left: 3px solid #EF4444; }
        .status-warning { border-left: 3px solid #F59E0B; }
        .product-row:nth-child(even) { background: rgba(255,255,255,0.02); }
        .product-row:hover { background: rgba(139,92,246,0.06); transition: background 0.15s; }

        .skeleton {
            background: linear-gradient(90deg, #1A1D27 25%, #22263A 50%, #1A1D27 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
            border-radius: 16px;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .anim { animation: fadeUp 0.4s ease-out both; }

        .revenue-bar-bg { height: 4px; background: #282D3A; border-radius: 999px; }
        .revenue-bar-fill { height: 4px; border-radius: 999px; transition: width 0.6s ease; }

        /* KPI Grid */
        .kpi-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        .kpi-grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; }
        .chart-row { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        .products-row { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        .bottom-row { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }

        @media (prefers-reduced-motion: reduce) { .anim { animation: none; } }
        @media print {
            body { background: #0F1117 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .no-print { display: none !important; }
            .card { break-inside: avoid; }
        }
        @media (max-width: 1023px) {
            .kpi-grid-4 { grid-template-columns: repeat(2, 1fr) !important; }
            .kpi-grid-5 { grid-template-columns: repeat(3, 1fr) !important; }
            .chart-row, .products-row, .bottom-row { grid-template-columns: 1fr !important; }
        }
        @media (max-width: 767px) {
            .kpi-grid-5 { grid-template-columns: repeat(2, 1fr) !important; }
        }
        @media (max-width: 479px) {
            .kpi-grid-4, .kpi-grid-5 { grid-template-columns: 1fr !important; }
        }

<script>
(function() {
    var D = window.__HERMES_DATA__;
    if (!D) { document.getElementById('dashboard-content').innerHTML = '<p class="text-red-400 text-center py-20 text-sm">No data. Run: python generate_dashboard.py --demo</p>'; return; }

    var activeTab = 'overview';
    var charts = [];

    // ── Color System ──
    var PURPLE = '#8B5CF6';
    var CYAN = '#06B6D4';
    var GREEN = '#22C55E';
    var RED = '#EF4444';
    var AMBER = '#F59E0B';
    var PINK = '#EC4899';
    var BLUE = '#3B82F6';

    // KPI accent colors - subtle, used only for sparklines and indicators
    var KPI_COLORS = {
        'net_revenue': PURPLE, 'shopify_revenue': PURPLE, 'amazon_us_revenue': BLUE,
        'amazon_uk_revenue': PINK, 'email_revenue': CYAN,
        'us_revenue': BLUE, 'uk_revenue': PINK, 'sh_revenue': PURPLE,
        'meta_roas': AMBER, 'meta_cpa': RED, 'meta_spend': AMBER,
        'cac': RED, 'blended_aov': CYAN,
        'gross_margin': GREEN, 'total_orders': BLUE, 'returning_pct': CYAN,
        'active_subscribers': PURPLE, 'inventory_alerts': RED,
        'us_tacos': AMBER, 'us_ppc_spend': AMBER, 'us_acos': AMBER, 'us_organic_pct': GREEN,
        'us_orders': BLUE, 'us_aov': CYAN, 'us_units': BLUE, 'us_sessions': PURPLE,
        'uk_tacos': AMBER, 'uk_ppc_spend': AMBER, 'uk_acos': AMBER, 'uk_organic_pct': GREEN,
        'uk_orders': BLUE, 'uk_aov': CYAN, 'uk_units': BLUE,
        'sh_orders': BLUE, 'sh_aov': CYAN, 'sh_new_customers': GREEN,
        'sh_sessions': PURPLE, 'sh_cvr': GREEN, 'sh_cart_abandon': RED, 'sh_returning': CYAN
    };

    var SEC_LABELS = {
        'revenue':'Revenue','efficiency':'Efficiency','health':'Health',
        'performance':'Performance','advertising':'Advertising',
        'sales':'Sales','traffic':'Traffic'
    };

    // ── Helpers ──
    function destroyCharts() { charts.forEach(function(c){c.destroy();}); charts=[]; }
    function fmt(v,f) {
        if (v===null||v===undefined) return '\u2014';
        switch(f){
            case 'currency': return '$'+Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
            case 'currency_compact': return v>=10000?'$'+(v/1000).toFixed(1)+'k':'$'+Number(v).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});
            case 'currency_gbp': return '\u00A3'+Number(v).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
            case 'currency_gbp_compact': return v>=10000?'\u00A3'+(v/1000).toFixed(1)+'k':'\u00A3'+Number(v).toLocaleString('en-GB',{minimumFractionDigits:0,maximumFractionDigits:0});
            case 'multiplier': return Number(v).toFixed(2)+'x';
            case 'percent': return Number(v).toFixed(1)+'%';
            case 'number': return Number(v).toLocaleString();
            default: return String(v);
        }
    }
    function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
    function badge(ch,inv) {
        if(ch===null||ch===undefined) return '';
        var up=inv?ch<0:ch>0, cls=ch===0?'change-flat':up?'change-up':'change-down';
        var arr=ch===0?'':ch>0?'\u2191':'\u2193', sg=ch>0?'+':'';
        return '<span class="change-badge '+cls+'">'+arr+' '+sg+ch.toFixed(1)+'%</span>';
    }

    // ── SVG Sparkline: subtle, below the number ──
    function spark(data,color) {
        if(!data||data.length<2) return '';
        var w=200,h=48,p=2,mn=Math.min.apply(null,data),mx=Math.max.apply(null,data),rng=mx-mn||1;
        var pts=data.map(function(v,i){return(p+(i/(data.length-1))*(w-p*2)).toFixed(1)+','+(p+(1-(v-mn)/rng)*(h-p*2)).toFixed(1);}).join(' ');
        var fX=p.toFixed(1),lX=(p+(w-p*2)).toFixed(1);
        var fill=pts+' '+lX+','+(h-p)+' '+fX+','+(h-p);
        return '<svg class="w-full" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" fill="none" style="display:block;">' +
            '<polygon points="'+fill+'" fill="'+color+'" opacity="0.1"/>' +
            '<polyline points="'+pts+'" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6"/></svg>';
    }

    // ── Progress Ring: small, inline ──
    function ringSmall(pct,color) {
        var r=16,c=2*Math.PI*r,d=(Math.min(pct,100)/100)*c;
        return '<svg viewBox="0 0 40 40" width="40" height="40" style="display:inline-block;vertical-align:middle;">' +
            '<circle cx="20" cy="20" r="'+r+'" fill="none" stroke="#282D3A" stroke-width="3"/>' +
            '<circle cx="20" cy="20" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="3" stroke-linecap="round" stroke-dasharray="'+d.toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 20 20)"/>' +
            '<text x="20" y="21" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="white" font-weight="700" font-family="Fira Code,monospace">'+Math.round(pct)+'</text></svg>';
    }

    // ═══ CARD BUILDER: One unified card with sparkline ═══
    function kpiCard(kpi,delay) {
        var color = KPI_COLORS[kpi.key] || PURPLE;
        var isHero = kpi.hero;
        var cls = isHero ? 'card card-hero anim' : 'card anim';
        var hasTarget = kpi.target && kpi.progress !== undefined;

        var h = '<div class="'+cls+'" style="animation-delay:'+(delay||0)+'ms">';

        // Label row
        h += '<div class="flex items-center justify-between mb-3">';
        h += '<span class="text-[11px] font-semibold text-[#64748B] uppercase tracking-widest">'+esc(kpi.label)+'</span>';
        h += badge(kpi.change,kpi.invert);
        h += '</div>';

        // Value row with optional ring
        h += '<div class="flex items-center justify-between">';
        h += '<div class="text-[28px] font-bold font-mono text-white leading-none tracking-tight">'+fmt(kpi.value,kpi.format)+'</div>';
        if(hasTarget) {
            h += ringSmall(kpi.progress, color);
        }
        h += '</div>';

        // Detail
        if(kpi.detail) h += '<p class="text-[11px] text-[#475569] mt-2">'+esc(kpi.detail)+'</p>';

        // Target label
        if(hasTarget) {
            var sym = (kpi.format==='currency_gbp'||kpi.format==='currency_gbp_compact') ? '\u00A3' : '$';
            var tgt = kpi.target>=1000 ? sym+(kpi.target/1000).toFixed(0)+'k' : sym+kpi.target;
            h += '<p class="text-[10px] text-[#475569] mt-1 font-mono">'+kpi.progress.toFixed(1)+'% of '+tgt+' target</p>';
        }

        // Sparkline
        h += '<div class="mt-4">'+spark(kpi.sparkline,color)+'</div>';

        h += '</div>';
        return h;
    }

    // ── Section Header ──
    function secHeader(group) {
        var title = SEC_LABELS[group] || group;
        return '<div class="flex items-center gap-3 mt-2 mb-4"><div class="w-1.5 h-1.5 rounded-full" style="background:'+PURPLE+'"></div>' +
            '<span class="text-[11px] font-bold text-[#64748B] uppercase tracking-[0.15em]">'+esc(title)+'</span>' +
            '<div class="flex-1 h-px" style="background: rgba(255,255,255,0.04)"></div></div>';
    }

    // ── Headlines: 4 hero KPI cards ──
    function headlines(items) {
        if(!items||!items.length) return '';
        return '<div class="kpi-grid-4">'+items.map(function(item,i) {
            var b='';
            if(item.change!==null&&item.change!==undefined) b=badge(item.change,item.invert);
            else if(item.status) {
                var sc=item.status==='warning'?'bg-amber-900/30 text-amber-400':item.status==='critical'?'bg-red-900/30 text-red-400':'bg-emerald-900/30 text-emerald-400';
                b='<span class="change-badge '+sc+'">'+esc(item.detail||'')+'</span>';
            }
            var first=i===0;
            return '<div class="card'+(first?' card-hero':'')+' anim" style="animation-delay:'+(i*60)+'ms">' +
                '<span class="text-[11px] font-semibold text-[#64748B] uppercase tracking-widest">'+esc(item.label)+'</span>' +
                '<div class="text-[36px] font-bold font-mono text-white leading-none tracking-tight mt-3">'+fmt(item.value,item.format)+'</div>' +
                '<div class="mt-3">'+b+'</div></div>';
        }).join('')+'</div>';
    }

    // ── Pulse ──
    function pulse(view) {
        var parts=[],hl=view.headline||[],r=hl[0];
        if(r&&r.change) parts.push('Revenue '+(r.change>0?'up':'down')+' <strong class="text-white">'+Math.abs(r.change).toFixed(1)+'%</strong>');
        var al=view.inventory_alerts||[],cr=al.filter(function(a){return a.severity==='critical';}).length,wr=al.filter(function(a){return a.severity==='warning';}).length;
        if(cr+wr>0) parts.push('<strong class="text-white">'+(cr+wr)+'</strong> item'+(cr+wr>1?'s':'')+' need restocking');
        var rk=(view.kpis||[]).find(function(k){return k.key==='meta_roas';});
        if(rk&&rk.value) parts.push('Meta ROAS at <strong class="text-white">'+rk.value.toFixed(1)+'x</strong>');
        if(!parts.length) return '';
        return '<div class="card anim" style="background: linear-gradient(135deg, rgba(139,92,246,0.08) 0%, rgba(6,182,212,0.05) 100%); animation-delay: 250ms;">' +
            '<div class="flex items-center justify-center gap-2"><svg class="w-4 h-4 text-purple-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>' +
            '<p class="text-sm text-[#94A3B8]">'+parts.join(' <span class="text-[#334155] mx-1">\u00B7</span> ')+'</p></div></div>';
    }

    // ── KPI Section ──
    function kpiSection(kpis,group) {
        var f=kpis.filter(function(k){return k.group===group;});
        if(!f.length) return '';
        var cls=f.length<=4?'kpi-grid-4':'kpi-grid-5';
        return secHeader(group)+'<div class="'+cls+'">'+f.map(function(k,i){return kpiCard(k,300+i*60);}).join('')+'</div>';
    }

    // ── Channel Badge ──
    function chBadge(ch){
        var c=ch==='Shopify'?'bg-purple-500/10 text-purple-400':ch==='Amazon US'?'bg-blue-500/10 text-blue-400':'bg-pink-500/10 text-pink-400';
        return '<span class="text-[10px] font-mono font-bold px-2.5 py-0.5 rounded-md '+c+'">'+esc(ch)+'</span>';
    }
    function trend(t){return t==='up'?'<span class="text-emerald-400">\u2191</span>':t==='down'?'<span class="text-red-400">\u2193</span>':'<span class="text-[#475569]">\u2192</span>';}

    // ── Products Table ──
    function prodTable(prods,title,showCh,showBsr) {
        if(!prods||!prods.length) return '';
        var mx=Math.max.apply(null,prods.map(function(p){return p.revenue;}));
        var hd='<th class="text-left pb-3 pl-4 w-8">#</th><th class="text-left pb-3">Product</th>';
        if(showCh) hd+='<th class="text-left pb-3">Channel</th>';
        hd+='<th class="text-left pb-3 w-40">Revenue</th><th class="text-right pb-3">Units</th>';
        if(showBsr) hd+='<th class="text-right pb-3">BSR</th>';
        hd+='<th class="text-right pb-3">CVR</th><th class="text-center pb-3 pr-4 w-8"></th>';
        var rows=prods.map(function(p,i){
            var cvr=p.conversion_rate?p.conversion_rate.toFixed(1)+'%':'\u2014';
            var rc=i<3?'text-purple-400 font-bold':'text-[#475569]';
            var bp=mx>0?(p.revenue/mx*100):0;
            var bc=i<3?PURPLE:i<7?'#6D28D9':'#282D3A';
            var rv='<td class="py-3 text-sm"><div class="flex items-center gap-3"><span class="font-mono text-[#E2E8F0] w-16 text-right text-[13px]">$'+Number(p.revenue).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0})+'</span>' +
                '<div class="flex-1 revenue-bar-bg"><div class="revenue-bar-fill" style="width:'+bp.toFixed(0)+'%;background:'+bc+'"></div></div></div></td>';
            var r='<td class="py-3 pl-4 text-xs font-mono '+rc+'">'+(i+1)+'</td><td class="py-3 text-sm text-[#CBD5E1] max-w-[200px] truncate">'+esc(p.name)+'</td>';
            if(showCh) r+='<td class="py-3">'+chBadge(p.channel)+'</td>';
            r+=rv+'<td class="py-3 text-sm font-mono text-right text-[#94A3B8]">'+p.units+'</td>';
            if(showBsr) r+='<td class="py-3 text-sm font-mono text-right text-[#64748B]">#'+(p.bsr||'\u2014')+'</td>';
            r+='<td class="py-3 text-sm font-mono text-right text-[#94A3B8]">'+cvr+'</td><td class="py-3 text-center pr-4">'+trend(p.trend)+'</td>';
            return '<tr class="border-b border-white/[0.03] product-row">'+r+'</tr>';
        }).join('');
        return '<div class="card"><div class="flex items-center justify-between mb-4"><span class="text-[14px] font-semibold text-white">'+esc(title)+'</span>' +
            '<span class="text-[11px] font-mono text-[#64748B] px-2.5 py-1 rounded-md" style="background:#282D3A">'+prods.length+' items</span></div>' +
            '<div class="overflow-x-auto"><table class="w-full"><thead><tr class="text-[10px] font-semibold text-[#475569] uppercase tracking-wider border-b border-white/[0.05]">'+hd+'</tr></thead><tbody>'+rows+'</tbody></table></div></div>';
    }

    // ── Alerts ──
    function alerts(al,title) {
        if(!al) al=[];
        var cr=al.filter(function(a){return a.severity==='critical';}).length, wr=al.filter(function(a){return a.severity==='warning';}).length;
        var bdg=al.length>0?'<div class="flex items-center gap-2">'+(cr>0?'<span class="text-[10px] font-mono px-2 py-0.5 rounded-md bg-red-500/10 text-red-400 font-bold">'+cr+' critical</span>':'')+(wr>0?'<span class="text-[10px] font-mono px-2 py-0.5 rounded-md bg-amber-500/10 text-amber-400 font-bold">'+wr+' warning</span>':'')+'</div>':'<span class="text-[10px] font-mono px-2 py-0.5 rounded-md bg-emerald-500/10 text-emerald-400 font-bold">All clear</span>';
        var items;
        if(al.length>0){items=al.map(function(a){var ic=a.severity==='critical',bc=ic?'status-critical':'status-warning';
            var chip=ic?'<span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-red-500/10 text-red-400">OOS</span>':'<span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-amber-500/10 text-amber-400">'+(a.inventory||0)+' left</span>';
            var nm=a.product||a.name||a.sku;
            return '<div class="px-3 py-2.5 rounded-xl '+bc+'" style="background:rgba(255,255,255,0.02)"><div class="flex items-center justify-between"><span class="text-sm text-[#CBD5E1] truncate max-w-[160px]">'+esc(nm)+'</span>'+chip+'</div>' +
                '<p class="text-[10px] text-[#475569] mt-1">'+esc(a.source||'')+(a.sku?' \u00B7 '+esc(a.sku):'')+'</p></div>';}).join('');}
        else{items='<div class="flex flex-col items-center py-6 text-[#475569]"><svg class="w-8 h-8 mb-2 text-emerald-500/40" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><p class="text-sm">All stock healthy</p></div>';}
        return '<div class="card"><div class="flex items-center justify-between mb-3"><span class="text-[14px] font-semibold text-white">'+esc(title||'Inventory Alerts')+'</span>'+bdg+'</div><div class="space-y-2 max-h-60 overflow-y-auto">'+items+'</div></div>';
    }

    // ── Meta Campaigns ──
    function campaigns(camp) {
        if(!camp||!camp.length) return '';
        var its=camp.map(function(c){var rc=c.roas>=2?'text-emerald-400 bg-emerald-500/10':c.roas>=1?'text-amber-400 bg-amber-500/10':'text-red-400 bg-red-500/10';
            return '<div class="px-3 py-3 rounded-xl" style="background:rgba(255,255,255,0.02)"><div class="flex items-center justify-between"><p class="text-sm text-[#CBD5E1] truncate max-w-[180px]">'+esc(c.name)+'</p>' +
                '<span class="text-[10px] font-mono px-2 py-0.5 rounded-md '+rc+' font-bold">'+c.roas.toFixed(1)+'x</span></div>' +
                '<div class="flex items-center gap-4 mt-1.5 text-[10px] font-mono text-[#475569]"><span>$'+c.spend.toFixed(0)+'</span><span>'+c.purchases+' sales</span></div></div>';}).join('');
        var ts=camp.reduce(function(s,c){return s+c.spend;},0),ar=camp.reduce(function(s,c){return s+c.roas*c.spend;},0)/ts;
        return '<div class="card"><div class="flex items-center justify-between mb-3"><span class="text-[14px] font-semibold text-white">Meta Campaigns</span>' +
            '<span class="text-[10px] font-mono text-purple-400 px-2 py-0.5 rounded-md bg-purple-500/10 font-bold">'+ar.toFixed(1)+'x avg</span></div>' +
            '<div class="space-y-2 max-h-60 overflow-y-auto">'+its+'</div></div>';
    }

    // ── Landing Pages ──
    function landingPages(pages) {
        if(!pages||!pages.length) return '';
        var rows=pages.map(function(p){return '<tr class="border-b border-white/[0.03] product-row"><td class="py-2.5 text-sm text-purple-400 font-mono truncate max-w-[180px]">'+esc(p.page)+'</td>' +
            '<td class="py-2.5 text-sm font-mono text-right text-[#94A3B8]">'+Number(p.sessions).toLocaleString()+'</td>' +
            '<td class="py-2.5 text-sm font-mono text-right text-[#94A3B8]">'+p.conversion_rate.toFixed(1)+'%</td>' +
            '<td class="py-2.5 text-sm font-mono text-right text-white">$'+Number(p.revenue).toLocaleString('en-US',{minimumFractionDigits:0})+'</td></tr>';}).join('');
        return '<div class="card"><span class="text-[14px] font-semibold text-white mb-4 block">Top Landing Pages</span><div class="overflow-x-auto"><table class="w-full">' +
            '<thead><tr class="text-[10px] font-semibold text-[#475569] uppercase tracking-wider border-b border-white/[0.05]"><th class="text-left pb-3">Page</th><th class="text-right pb-3">Sessions</th><th class="text-right pb-3">CVR</th><th class="text-right pb-3">Revenue</th></tr></thead>' +
            '<tbody>'+rows+'</tbody></table></div></div>';
    }

    // ── Channel Legend ──
    function chLegend(pct) {
        if(!pct) return '';
        var colors={'Shopify':PURPLE,'Amazon US':BLUE,'Amazon UK':PINK};
        return Object.keys(pct).map(function(ch){
            return '<div class="flex items-center justify-between py-2 px-3 rounded-lg" style="background:rgba(255,255,255,0.03)"><div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full" style="background:'+(colors[ch]||'#94A3B8')+'"></span><span class="text-[13px] text-[#94A3B8]">'+ch+'</span></div><span class="font-mono text-[13px] font-semibold text-white">'+pct[ch]+'%</span></div>';
        }).join('');
    }

    // ── Footer ──
    function sources() {
        var s=D.sources||{},ds=Object.keys(s).map(function(n){return '<div class="flex items-center gap-1.5"><div class="w-1.5 h-1.5 rounded-full '+(s[n]?'bg-emerald-500':'bg-red-500')+'"></div><span class="text-[10px] font-mono text-[#475569] uppercase tracking-wide">'+n+'</span></div>';}).join('');
        var ts=D.generated_at?new Date(D.generated_at).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
        return '<div class="flex items-center justify-center gap-6 py-6 mt-8" style="border-top:1px solid rgba(255,255,255,0.04)">'+ds+'<span class="text-[10px] text-[#334155] font-mono">|</span><span class="text-[10px] text-[#475569] font-mono">'+ts+'</span><span class="text-[10px] text-[#334155] font-mono">|</span><span class="text-[10px] text-[#475569] font-mono">Hermes v9</span></div>';
    }

    // ── Skeleton ──
    function skeleton() {
        var s='';for(var i=0;i<4;i++)s+='<div class="skeleton h-32"></div>';
        var s2='';for(var j=0;j<5;j++)s2+='<div class="skeleton h-40"></div>';
        return '<div class="kpi-grid-4">'+s+'</div><div class="kpi-grid-5 mt-5">'+s2+'</div>';
    }

    // ── Chart Helpers ──
    var ttStyle = {
        backgroundColor:'#1A1D27', titleColor:'#FFF', bodyColor:'#94A3B8',
        borderColor:'rgba(255,255,255,0.06)', borderWidth:1,
        titleFont:{family:'Inter',size:12,weight:'600'}, bodyFont:{family:'Fira Code',size:11},
        padding:12, cornerRadius:12, boxPadding:4
    };
    function grad(ctx,hex,h){
        var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
        var gr=ctx.createLinearGradient(0,0,0,h);
        gr.addColorStop(0,'rgba('+r+','+g+','+b+',0.2)');
        gr.addColorStop(1,'rgba('+r+','+g+','+b+',0)');
        return gr;
    }

    function lineChart(id,labels,datasets) {
        var el=document.getElementById(id);if(!el)return;var ctx=el.getContext('2d');
        var ds=datasets.map(function(d){return{label:d.label,data:d.data,borderColor:d.color,backgroundColor:grad(ctx,d.color,el.parentElement.clientHeight||320),fill:true,tension:0.4,borderWidth:2,pointRadius:0,pointHoverRadius:5,pointHoverBackgroundColor:d.color,pointHoverBorderColor:'#1A1D27',pointHoverBorderWidth:3};});
        var ch=new Chart(ctx,{type:'line',data:{labels:labels,datasets:ds},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
            plugins:{legend:{display:false},tooltip:Object.assign({},ttStyle,{displayColors:true,boxWidth:8,boxHeight:8,callbacks:{label:function(c){return ' '+c.dataset.label+': $'+c.parsed.y.toLocaleString('en-US',{minimumFractionDigits:0});}}})},
            scales:{x:{ticks:{color:'#475569',font:{family:'Inter',size:10},maxRotation:0,maxTicksLimit:8},grid:{color:'rgba(255,255,255,0.03)',drawBorder:false},border:{display:false}},
                y:{ticks:{color:'#475569',font:{family:'Fira Code',size:10},callback:function(v){return '$'+(v>=1000?(v/1000).toFixed(0)+'k':v);}},grid:{color:'rgba(255,255,255,0.03)',drawBorder:false},border:{display:false}}}}});
        charts.push(ch);
    }

    function donutChart(id,labels,values,colors) {
        var el=document.getElementById(id);if(!el)return;
        var ch=new Chart(el,{type:'doughnut',data:{labels:labels,datasets:[{data:values,backgroundColor:colors,borderColor:'#1A1D27',borderWidth:3,hoverOffset:6}]},
            options:{responsive:true,maintainAspectRatio:false,cutout:'75%',plugins:{legend:{display:false},tooltip:Object.assign({},ttStyle,{callbacks:{label:function(c){return ' $'+c.parsed.toLocaleString('en-US',{minimumFractionDigits:0});}}})}}});
        charts.push(ch);
    }

    function totalStr(bd){var t=Object.values(bd).reduce(function(s,v){return s+v;},0);return t>=1000?'$'+(t/1000).toFixed(1)+'k':'$'+t.toFixed(0);}

    // ═══ RENDER: Overview ═══
    function renderOverview(v) {
        var ct=document.getElementById('dashboard-content');
        var sr=v.daily_series||{},dt=Object.keys(sr).sort();
        var sd=dt.map(function(d){return new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});});
        var bd=v.channel_breakdown||{},cId='c-'+Date.now(),dId='d-'+Date.now();

        ct.innerHTML = headlines(v.headline||[]) + pulse(v) +
            kpiSection(v.kpis,'revenue') + kpiSection(v.kpis,'efficiency') + kpiSection(v.kpis,'health') +

            '<div class="chart-row"><div class="card">' +
                '<div class="flex items-center justify-between mb-4"><span class="text-[14px] font-semibold text-white">Revenue by Channel</span>' +
                '<div class="flex items-center gap-5 text-[11px]">' +
                    '<span class="flex items-center gap-1.5"><span class="w-2.5 h-[2px] rounded-full inline-block" style="background:'+PURPLE+'"></span><span class="text-[#64748B]">Shopify</span></span>' +
                    '<span class="flex items-center gap-1.5"><span class="w-2.5 h-[2px] rounded-full inline-block" style="background:'+BLUE+'"></span><span class="text-[#64748B]">Amazon US</span></span>' +
                    '<span class="flex items-center gap-1.5"><span class="w-2.5 h-[2px] rounded-full inline-block" style="background:'+PINK+'"></span><span class="text-[#64748B]">Amazon UK</span></span></div></div>' +
                '<div class="relative h-72"><canvas id="'+cId+'"></canvas></div></div>' +
            '<div class="card"><span class="text-[14px] font-semibold text-white mb-4 block">Channel Split</span>' +
                '<div class="relative h-44 flex items-center justify-center"><canvas id="'+dId+'"></canvas>' +
                    '<div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none"><span class="text-[10px] text-[#475569] font-mono uppercase tracking-widest">Total</span>' +
                    '<span class="text-xl font-bold font-mono text-white">'+totalStr(bd)+'</span></div></div>' +
                '<div class="mt-4 space-y-1.5">'+chLegend(v.channel_pct)+'</div></div></div>' +

            '<div class="products-row"><div>'+prodTable(v.top_products,'Top Products',true,false)+'</div>' +
                '<div class="space-y-5">'+alerts(v.inventory_alerts,'Inventory Alerts')+campaigns(v.meta_campaigns)+'</div></div>' +
            prodTable(v.bottom_products,'Bottom Performers',true,false) +
            sources();

        if(dt.length>0) lineChart(cId,sd,[{label:'Shopify',data:dt.map(function(d){return sr[d].shopify||0;}),color:PURPLE},{label:'Amazon US',data:dt.map(function(d){return sr[d].amazon_us||0;}),color:BLUE},{label:'Amazon UK',data:dt.map(function(d){return sr[d].amazon_uk||0;}),color:PINK}]);
        if(Object.keys(bd).length>0) donutChart(dId,Object.keys(bd),Object.values(bd),[PURPLE,BLUE,PINK]);
    }

    // ═══ RENDER: Channel ═══
    function renderChannel(v,name,color) {
        var ct=document.getElementById('dashboard-content'),sr=v.daily_series||{},dt=Object.keys(sr).sort();
        var sd=dt.map(function(d){return new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});});
        var cId='ch-'+Date.now(),groups=[],seen={};
        (v.kpis||[]).forEach(function(k){if(k.group&&!seen[k.group]){seen[k.group]=true;groups.push(k.group);}});
        var html=headlines(v.headline||[]);
        groups.forEach(function(g){html+=kpiSection(v.kpis,g);});
        html+='<div class="card"><div class="flex items-center justify-between mb-4"><span class="text-[14px] font-semibold text-white">Daily Revenue</span></div><div class="relative h-72"><canvas id="'+cId+'"></canvas></div></div>';
        var bsr=!!(v.top_products&&v.top_products[0]&&v.top_products[0].bsr);
        html+='<div class="products-row"><div>'+prodTable(v.top_products,name+' Top Products',false,bsr)+'</div><div>'+alerts(v.inventory_alerts,name+' Inventory')+'</div></div>';
        if(v.bottom_products&&v.bottom_products.length>0) html+=prodTable(v.bottom_products,name+' Bottom Performers',false,bsr);
        html+=sources();ct.innerHTML=html;
        if(dt.length>0) lineChart(cId,sd,[{label:'Revenue',data:dt.map(function(d){return(sr[d]||{}).revenue||0;}),color:color}]);
    }

    // ═══ RENDER: Shopify ═══
    function renderShopify(v) {
        var ct=document.getElementById('dashboard-content'),sr=v.daily_series||{},dt=Object.keys(sr).sort();
        var sd=dt.map(function(d){return new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});});
        var cId='sh-'+Date.now(),groups=[],seen={};
        (v.kpis||[]).forEach(function(k){if(k.group&&!seen[k.group]){seen[k.group]=true;groups.push(k.group);}});
        var html=headlines(v.headline||[]);
        groups.forEach(function(g){html+=kpiSection(v.kpis,g);});
        html+='<div class="card"><div class="flex items-center justify-between mb-4"><span class="text-[14px] font-semibold text-white">Daily Revenue</span></div><div class="relative h-72"><canvas id="'+cId+'"></canvas></div></div>';
        html+='<div class="products-row"><div>'+prodTable(v.top_products,'Shopify Products',false,false)+'</div><div class="space-y-5">'+alerts(v.inventory_alerts,'Shopify Inventory')+campaigns(v.meta_campaigns)+'</div></div>';
        if(v.bottom_products&&v.bottom_products.length>0) html+=prodTable(v.bottom_products,'Shopify Bottom Performers',false,false);
        html+=landingPages(v.top_landing_pages)+sources();ct.innerHTML=html;
        if(dt.length>0) lineChart(cId,sd,[{label:'Revenue',data:dt.map(function(d){return(sr[d]||{}).revenue||0;}),color:PURPLE}]);
    }

    // ═══ Tab Switch ═══
    function switchTab(tab) {
        activeTab=tab;destroyCharts();
        document.querySelectorAll('.channel-tab').forEach(function(b){b.dataset.tab===tab?b.classList.add('tab-active'):b.classList.remove('tab-active');});
        var v=D.views?D.views[tab]:null;
        if(!v){document.getElementById('dashboard-content').innerHTML='<p class="text-[#64748B] text-center py-20 text-sm">No data for this view.</p>';return;}
        document.getElementById('dashboard-content').innerHTML=skeleton();
        setTimeout(function(){
            switch(tab){case 'overview':renderOverview(v);break;case 'amazon_us':renderChannel(v,'Amazon US',BLUE);break;case 'amazon_uk':renderChannel(v,'Amazon UK',PINK);break;case 'shopify':renderShopify(v);break;}
        },80);
    }

    // ═══ Init ═══
    if(D.generated_at){var end=new Date(D.generated_at),start=new Date(end);start.setDate(start.getDate()-(D.period_days||30));var o={month:'short',day:'numeric'};var el=document.getElementById('date-range');if(el)el.textContent=start.toLocaleDateString('en-US',o)+' \u2013 '+end.toLocaleDateString('en-US',o);}
    var sel=document.getElementById('period-selector');['7D','30D','90D'].forEach(function(l){var a=l===D.period_days+'D',b=document.createElement('button');b.textContent=l;b.className='px-3 py-1.5 text-xs font-medium rounded-md cursor-pointer transition-all '+(a?'bg-purple-500/20 text-purple-300':'text-[#64748B] hover:text-[#94A3B8]');sel.appendChild(b);});
    document.getElementById('export-btn').addEventListener('click',function(){window.print();});
    document.querySelectorAll('.channel-tab').forEach(function(b){b.addEventListener('click',function(){switchTab(b.dataset.tab);});});
    switchTab('overview');
})();
</script>
