        var isFlat = change === 0;
        var cls = isFlat ? 'change-flat' : isUp ? 'change-up' : 'change-down';
        var arrow = isFlat ? '' : isUp ? '\u2191' : '\u2193';
        var sign = isUp ? '+' : '';
        return '<span class="change-badge ' + cls + '">' + arrow + sign + change.toFixed(1) + '%</span>';
    }

    // ── #3 Goal progress bar ──
    function buildGoalBar(kpi) {
        if (!kpi.target || kpi.progress === undefined) return '';
        var pct = Math.min(kpi.progress, 100);
        var color = pct < 5 ? '#ef4444' : pct < 15 ? '#f59e0b' : '#8b5cf6';
        return '<div class="goal-bar"><div class="goal-bar-fill" style="width:' + pct + '%;background:' + color + '"></div></div>' +
            '<p class="text-[9px] text-slate-600 mt-1 font-mono">' + pct.toFixed(1) + '% of ' +
            (kpi.format === 'currency_gbp' ? '\u00A3' : '$') + (kpi.target >= 1000 ? (kpi.target/1000).toFixed(0) + 'k' : kpi.target) + ' target</p>';
    }

    // ── #10 Pulse summary ──
    function buildPulseSummary() {
        var revKpi = DATA.kpis.find(function(k) { return k.key === 'net_revenue'; });
        var alertKpi = DATA.kpis.find(function(k) { return k.key === 'inventory_alerts'; });
        var roasKpi = DATA.kpis.find(function(k) { return k.key === 'meta_roas'; });

        var parts = [];
        if (revKpi && revKpi.change !== undefined) {
            var dir = revKpi.change > 0 ? 'up' : revKpi.change < 0 ? 'down' : 'flat';
            parts.push('Revenue ' + dir + ' ' + Math.abs(revKpi.change).toFixed(1) + '% WoW');
        }
        if (alertKpi && alertKpi.value > 0) {
            var oos = (alertKpi.detail || '').match(/(\d+)\s*OOS/);
            parts.push((oos ? oos[1] : alertKpi.value) + ' item' + (alertKpi.value > 1 ? 's' : '') + ' need restocking');
        }
        if (roasKpi && roasKpi.value > 0) {
            parts.push('Meta ROAS at ' + roasKpi.value.toFixed(2) + 'x');
        }

        if (parts.length === 0) return '';
        return '<div class="glass px-5 py-3 text-center">' +
            '<p class="text-[12px] font-mono text-slate-400">' +
            '<span class="text-purple-400 mr-2">\u26A1</span>' +
            parts.join('<span class="text-slate-700 mx-2">|</span>') +
            '</p></div>';
    }

    // ── KPI Card Builder ──
    function buildKpiCard(kpi) {
        var isHero = kpi.key === 'net_revenue';
        var cls = isHero ? 'kpi-card hero' : 'kpi-card';
        var sparkColor = kpi.change > 0 ? '#34d399' : kpi.change < 0 ? '#ef4444' : '#94a3b8';
        var hasGoal = ['net_revenue', 'shopify_revenue', 'amazon_us_revenue', 'amazon_uk_revenue'].indexOf(kpi.key) >= 0;
        var tooltip = kpi.tooltip ? '<div class="kpi-tooltip">' + esc(kpi.tooltip) + '</div>' : '';
        var detail = kpi.detail ? '<p class="text-[10px] text-slate-600 mt-1">' + esc(kpi.detail) + '</p>' : '';
        var valueCls = isHero ? 'kpi-value text-4xl' : 'kpi-value text-2xl';

        return '<div class="' + cls + '">' +
            tooltip +
            '<div class="flex items-center justify-between mb-1.5">' +
                '<p class="text-[11px] text-slate-500 font-medium">' + esc(kpi.label) + '</p>' +
                buildChangeBadge(kpi.change) +

                '<div class="flex-shrink-0 mb-1">' + buildSparkline(kpi.sparkline, sparkColor) + '</div>' +

        }).join('');

    // ── #15 Mini Calendar Heatmap ──
    function buildHeatmap() {
        var series = DATA.daily_series || {};
        var dates = Object.keys(series).sort();
        if (dates.length === 0) return '';

        // Calculate daily totals
        var dailyTotals = {};
        var maxRev = 0;
        dates.forEach(function(d) {
            var day = series[d];
            var total = (day.shopify || 0) + (day.amazon_us || 0) + (day.amazon_uk || 0);
            dailyTotals[d] = total;
            if (total > maxRev) maxRev = total;
        });

        // Color intensity function
        function cellColor(val) {
            if (maxRev === 0) return 'rgba(139,92,246,0.05)';
            var intensity = val / maxRev;
            if (intensity < 0.15) return 'rgba(139,92,246,0.06)';
            if (intensity < 0.35) return 'rgba(139,92,246,0.15)';
            if (intensity < 0.55) return 'rgba(139,92,246,0.3)';
            if (intensity < 0.75) return 'rgba(139,92,246,0.5)';
            return 'rgba(139,92,246,0.75)';
        }

        // Build a 5-week x 7-day grid, most recent date on the right
        // Pad to fill complete weeks
        var lastDate = new Date(dates[dates.length - 1] + 'T00:00:00');
        var dayOfWeek = lastDate.getDay(); // 0=Sun
        var totalCells = 35; // 5 weeks x 7 days
        var startOffset = totalCells - dates.length - (6 - dayOfWeek);

        var cells = [];
        for (var i = 0; i < totalCells; i++) {
            var dateIdx = i - Math.max(0, startOffset);
            var dateStr = dateIdx >= 0 && dateIdx < dates.length ? dates[dateIdx] : null;
            var val = dateStr ? dailyTotals[dateStr] || 0 : 0;
            var bg = dateStr ? cellColor(val) : 'rgba(255,255,255,0.02)';
            var title = dateStr ? dateStr + ': $' + val.toFixed(0) : '';
            cells.push('<div class="heatmap-cell" style="background:' + bg + ';" title="' + title + '"></div>');
        }

        // Arrange into columns (weeks)
        var weeks = [];
        for (var w = 0; w < 5; w++) {
            var weekCells = '';
            for (var d = 0; d < 7; d++) {
                weekCells += cells[w * 7 + d];
            }
            weeks.push('<div class="flex flex-col gap-[3px]">' + weekCells + '</div>');
        }

        var dayLabels = '<div class="flex flex-col gap-[3px] mr-1.5 text-[8px] font-mono text-slate-600">' +
            '<div style="height:14px;line-height:14px;">S</div><div style="height:14px;line-height:14px;">M</div><div style="height:14px;line-height:14px;">T</div><div style="height:14px;line-height:14px;">W</div><div style="height:14px;line-height:14px;">T</div><div style="height:14px;line-height:14px;">F</div><div style="height:14px;line-height:14px;">S</div>' +
            '</div>';

        // Legend
        var legend = '<div class="flex items-center gap-1 mt-3 text-[9px] text-slate-600 font-mono">' +
            '<span>Less</span>' +
            '<div class="heatmap-cell" style="background:rgba(139,92,246,0.06);width:10px;height:10px;"></div>' +
            '<div class="heatmap-cell" style="background:rgba(139,92,246,0.15);width:10px;height:10px;"></div>' +
            '<div class="heatmap-cell" style="background:rgba(139,92,246,0.3);width:10px;height:10px;"></div>' +
            '<div class="heatmap-cell" style="background:rgba(139,92,246,0.5);width:10px;height:10px;"></div>' +
            '<div class="heatmap-cell" style="background:rgba(139,92,246,0.75);width:10px;height:10px;"></div>' +
            '<span>More</span></div>';

        return '<div class="glass p-5">' +
            '<h2 class="text-sm font-semibold text-slate-200 mb-3">Daily Revenue Heatmap</h2>' +
            '<div class="flex items-start">' +
                dayLabels +
                '<div class="flex gap-[3px]">' + weeks.join('') + '</div>' +
            '</div>' +
            legend +
        '</div>';
    }

    var healthIcon = 'M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z';

    content.innerHTML =

        '<div class="grid grid-cols-3 gap-4 chart-row">' +
            '<div class="col-span-2 glass p-5">' +
                '<div class="flex items-center justify-between mb-4">' +
                    '<h2 class="text-sm font-semibold text-slate-200">Revenue by Channel</h2>' +
                    '<div class="flex items-center gap-5 text-[11px]">' +
                        '<span class="flex items-center gap-1.5"><span class="w-3 h-[3px] rounded-full bg-purple-400 inline-block"></span><span class="text-slate-400">Shopify</span></span>' +
                        '<span class="flex items-center gap-1.5"><span class="w-3 h-[3px] rounded-full bg-cyan-400 inline-block"></span><span class="text-slate-400">Amazon US</span></span>' +
                        '<span class="flex items-center gap-1.5"><span class="w-3 h-[3px] rounded-full bg-pink-400 inline-block"></span><span class="text-slate-400">Amazon UK</span></span>' +
                    '</div>' +
                '</div>' +
                '<div class="relative h-60"><canvas id="revenueChart"></canvas></div>' +
            '</div>' +
            '<div class="glass p-5">' +
                '<h2 class="text-sm font-semibold text-slate-200 mb-4">Channel Split</h2>' +
                '<div class="relative h-56 flex items-center justify-center">' +
                    '<canvas id="channelChart"></canvas>' +
                    '<div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">' +
                        '<span class="text-[10px] text-slate-500 font-mono">TOTAL</span>' +
                        '<span class="text-xl font-bold font-mono text-white">' + totalRev() + '</span>' +
                    '</div>' +
                '</div>' +
                '<div class="mt-4 space-y-2.5">' + buildChannelLegend() + '</div>' +
            '</div>' +
        '</div>' +

        '<div class="grid grid-cols-3 gap-4 products-row">' +
            buildProductsTable() +
            '<div class="space-y-4">' +
                buildAlerts() +
                buildCampaigns() +
            '</div>' +
        '</div>' +

        buildBottomProducts() +

        '<div class="grid grid-cols-2 gap-4">' +
            buildHeatmap() +
            '<div></div>' +
        '</div>' +

        buildSources();

    // ── #12 Set date range ──
    buildDateRange();

    // ── Charts ──
    var series = DATA.daily_series || {};
    var dates = Object.keys(series).sort();
    var shortDates = dates.map(function(d) { var dt = new Date(d + 'T00:00:00'); return dt.toLocaleDateString('en-US', {month:'short', day:'numeric'}); });

    var ttipStyle = { backgroundColor: 'rgba(0,0,0,0.95)', borderColor: 'rgba(139,92,246,0.2)', borderWidth: 1, titleColor: '#fff', bodyColor: '#94a3b8', titleFont: {family:'Fira Sans',size:12,weight:600}, bodyFont: {family:'Fira Code',size:11}, padding: 12, cornerRadius: 8 };

    // ── #6 Revenue chart with gradient fills ──
    if (dates.length > 0) {
        var ctx = document.getElementById('revenueChart').getContext('2d');

        function makeGradient(ctx, r, g, b) {
            var grad = ctx.createLinearGradient(0, 0, 0, ctx.canvas.clientHeight);
            grad.addColorStop(0, 'rgba(' + r + ',' + g + ',' + b + ', 0.25)');
            grad.addColorStop(0.5, 'rgba(' + r + ',' + g + ',' + b + ', 0.08)');
            grad.addColorStop(1, 'rgba(' + r + ',' + g + ',' + b + ', 0)');
            return grad;
        }

        var shopifyGrad = makeGradient(ctx, 139, 92, 246);
        var amazonUsGrad = makeGradient(ctx, 6, 182, 212);
        var amazonUkGrad = makeGradient(ctx, 236, 72, 153);

        new Chart(ctx, {
            type: 'line',
            data: {
                labels: shortDates,
                datasets: [
                    {
                        label: 'Shopify',
                        data: dates.map(function(d) { return series[d] ? series[d].shopify || 0 : 0; }),
                        borderColor: 'rgb(139,92,246)', backgroundColor: shopifyGrad,
                        fill: true, tension: 0.4, borderWidth: 2, pointRadius: 0,
                        pointHoverRadius: 5, pointHoverBackgroundColor: 'rgb(139,92,246)', pointHoverBorderColor: '#000', pointHoverBorderWidth: 2,
                    },
                    {
                        label: 'Amazon US',
                        data: dates.map(function(d) { return series[d] ? series[d].amazon_us || 0 : 0; }),
                        borderColor: 'rgb(6,182,212)', backgroundColor: amazonUsGrad,
                        fill: true, tension: 0.4, borderWidth: 2, pointRadius: 0,
                        pointHoverRadius: 5, pointHoverBackgroundColor: 'rgb(6,182,212)', pointHoverBorderColor: '#000', pointHoverBorderWidth: 2,
                    },
                    {
                        label: 'Amazon UK',
                        data: dates.map(function(d) { return series[d] ? series[d].amazon_uk || 0 : 0; }),
                        borderColor: 'rgb(236,72,153)', backgroundColor: amazonUkGrad,
                        fill: true, tension: 0.4, borderWidth: 2, pointRadius: 0,
                        pointHoverRadius: 5, pointHoverBackgroundColor: 'rgb(236,72,153)', pointHoverBorderColor: '#000', pointHoverBorderWidth: 2,
                    }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                interaction: {mode:'index', intersect:false},
                plugins: {
                    legend: {display:false},
                    tooltip: Object.assign({}, ttipStyle, {
                        displayColors: true, boxWidth: 8, boxHeight: 8,
                        callbacks: { label: function(ctx) { return ' ' + ctx.dataset.label + ': $' + ctx.parsed.y.toLocaleString('en-US',{minimumFractionDigits:2}); } }
                    })
                },
                scales: {
                    x: { ticks: {color:'#334155', font:{family:'Fira Sans',size:10}, maxRotation:0, maxTicksLimit:8}, grid: {color:'rgba(255,255,255,0.02)'}, border: {display:false} },
                    y: { ticks: {color:'#334155', font:{family:'Fira Code',size:10}, callback: function(v) { return '$'+(v>=1000?(v/1000).toFixed(0)+'k':v); }}, grid: {color:'rgba(255,255,255,0.02)'}, border: {display:false} },
                },
            }
        });
    }

    // ── #9 Larger donut chart ──
    var bd = DATA.channel_breakdown || {};
    if (Object.keys(bd).length > 0) {
        new Chart(document.getElementById('channelChart'), {
            type: 'doughnut',
            data: {
                labels: Object.keys(bd),
                datasets: [{
                    data: Object.values(bd),
                    backgroundColor: ['#8b5cf6','#06b6d4','#ec4899'],
                    borderColor: '#000', borderWidth: 3, hoverOffset: 12,
                    hoverBorderColor: '#1a1a2e',
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                cutout: '68%',
                plugins: {
                    legend: {display:false},
                    tooltip: Object.assign({}, ttipStyle, {
                        callbacks: { label: function(ctx) { return ' $' + ctx.parsed.toLocaleString('en-US',{minimumFractionDigits:2}); } }
                    })
                },
                animation: { animateScale: true, animateRotate: true },
            },
        });
    }

    // ── Period buttons (visual only in static mode) ──
    var sel = document.getElementById('period-selector');
    ['7D','30D','90D','6M'].forEach(function(label) {
        var active = label === DATA.period_days + 'D' || (label === '6M' && DATA.period_days === 180);
        var btn = document.createElement('button');
        btn.textContent = label;
        btn.className = 'px-3 py-1.5 text-xs font-medium rounded-md cursor-pointer transition-all ' + (active ? 'bg-purple-500/15 text-purple-400' : 'text-slate-500 hover:text-slate-300');
        sel.appendChild(btn);
    });

})();
</script>

</body>
</html>
